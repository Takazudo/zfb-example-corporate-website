# Deploy workflow for zfb-example-corporate-website (Cloudflare Pages).
#
# Installs zfb from npm (@takazudo/zfb ships a prebuilt Rust binary per
# platform via optional dependencies — no cargo toolchain needed), runs
# `pnpm build`, and deploys `dist/`.
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Budget: pnpm install (cold ~200MB platform binary on cache miss) + build
    # + up to 3 wrangler deploy attempts with 150s backoffs ≈ 11-13 min worst case.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify zfb CLI
        run: pnpm exec zfb --version

      - name: Build
        run: pnpm build

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Compute deploy branch slug
        id: branch
        env:
          GITHUB_HEAD_REF_VAL: ${{ github.head_ref }}
          GITHUB_REF_NAME_VAL: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Cloudflare Pages branch names cannot contain slashes; replace with hyphens.
            DEPLOY_BRANCH=$(echo "${GITHUB_HEAD_REF_VAL}" | tr '/' '-')
          else
            DEPLOY_BRANCH="main"
          fi
          echo "deploy_branch=${DEPLOY_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Idempotent: create on first run, no-op on subsequent runs.
          # wrangler@4 no longer auto-creates the project on `pages deploy`.
          out=$(wrangler pages project create zfb-example-corporate-website \
            --production-branch=main 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "Project created."
          elif echo "$out" | grep -qE "already exists|8000077|duplicate"; then
            echo "Project already exists — continuing."
          else
            echo "Project create failed with unexpected error."
            exit "$rc"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.deploy_branch }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3..."
            if wrangler pages deploy dist \
              --project-name=zfb-example-corporate-website \
              --branch="${DEPLOY_BRANCH}" \
              --commit-hash="${GITHUB_SHA}" \
              --commit-message="Deploy: ${GITHUB_SHA}"; then
              echo "Deploy succeeded on attempt $attempt"
              if [ "${DEPLOY_BRANCH}" = "main" ]; then
                echo "deploy_url=https://zfb-example-corporate-website.pages.dev/" >> "$GITHUB_OUTPUT"
              else
                echo "deploy_url=https://${DEPLOY_BRANCH}.zfb-example-corporate-website.pages.dev/" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Deploy failed, retrying in 150 seconds..."
              sleep 150
            fi
          done
          echo "Deploy failed after 3 attempts"
          exit 1

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.deploy_branch }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const deployBranch = process.env.DEPLOY_BRANCH;
            const marker = '<!-- cf-preview-branch -->';
            const body = `${marker}\n### Preview deployed\n\nBranch \`${deployBranch}\` is live at: ${deployUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
