# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build   — always runs (push + PR): install, typecheck (`zfb check`), build
#             (`zfb build`). This is the credential-free gate, so a fresh clone
#             or fork is green immediately.
#   deploy  — push to `main` only: `wrangler deploy`, then the post-deploy smoke
#             test against the custom domain. SELF-SKIPS when
#               * secrets.CLOUDFLARE_API_TOKEN is unset, or
#               * wrangler.toml still holds a REPLACE_WITH_* placeholder.
#             So the repo never shows a red deploy before Cloudflare is wired up.
#   preview — pull requests only: uploads a non-production version and posts its
#             preview URL as a PR comment. Self-skips the same way (fork PRs get
#             no secrets, so they skip rather than fail).
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit
#                          (+ Account Settings: Read) AND
#                          Zone · Workers Routes: Edit — the Zone permission is
#                          what attaches the custom domain in wrangler.toml.
#                          Without it the upload succeeds and the route step
#                          fails. See docs/cloudflare-setup.md.
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR runs are superseded by the next push, but a production deploy must never be
# cancelled mid-flight — two pushes in quick succession should both land, in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::notice::wrangler.toml still has a REPLACE_WITH_* placeholder — provision the resource, commit the real id, then deploy will run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # Only a request to the real hostname can prove the custom domain is
      # attached — no build-time or unit test can see that. Self-skips (exit 0)
      # while the hostname does not resolve yet.
      - name: Smoke test the live site
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm smoke

  preview:
    name: Preview deploy
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Fork PRs get no secrets, so this skips instead of failing.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping preview deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # `versions upload` publishes a version WITHOUT promoting it to production,
      # so the custom domain keeps serving main. --preview-alias gives the version
      # a stable per-PR hostname; it only routes because wrangler.toml sets both
      # workers_dev and preview_urls to true.
      #
      # Bootstrap order: the Worker is born from the first `wrangler deploy` on
      # main, so previews only work once that has run at least once. On the PR
      # that introduces this workflow there is no Worker yet and this step may
      # fail — that is a one-time migration artifact, not a config error.
      - name: Upload preview version
        id: preview
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Makes wrangler additionally emit machine-readable NDJSON, so the URL
          # can be read from a stable field instead of scraped from log prose.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" 2>&1 | tee upload.log
          # The account subdomain is not knowable from the repo, so the URL has to
          # come from wrangler. Prefer its structured output — the human-readable
          # "Version Preview Alias URL:" line is free to change wording between
          # releases, and a silent miss here means no PR comment.
          PREVIEW_URL=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' \
            "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' upload.log | head -1)
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "::warning::Could not determine a preview URL from the wrangler output."
          fi
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        if: steps.preview.outputs.preview_url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const marker = '<!-- cf-preview-version -->';
            const body = `${marker}\n### Preview deployed\n\nThis PR's version is live at: ${previewUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
