# Cloudflare Workers Static Assets configuration.
#
# This site is pure SSG: `zfb build` emits only static files into dist/ and the
# repo has no @takazudo/zfb-adapter-cloudflare dependency, so there is no
# server bundle to point at. That makes this an ASSETS-ONLY Worker — there is
# deliberately no `main` key. Cloudflare serves dist/ straight from the edge and
# no Worker code ever runs. (Adding `main` would require a dist/_worker.js that
# this build never produces, and `binding`/`run_worker_first` under [assets]
# only matter when Worker code exists to read env.ASSETS.)

name = "zfb-example-corporate-website"
compatibility_date = "2024-12-01"

# Top-level fields (MUST stay above the [assets] table — in TOML any key after
# a table header is scoped into that table; if these sit under [assets] wrangler
# warns "Unexpected fields found in assets field" and silently ignores them).
#
# workers_dev enables the worker's PUBLIC *.workers.dev subdomain. It is
# REQUIRED for the preview-alias URLs below to actually route: with workers_dev
# disabled, Cloudflare still PRINTS the pr-<N> preview-alias URL at upload time,
# but the edge rejects requests to it with "error code: 1042" (the workers.dev
# hostname is private). Production is also served on the custom domain at the
# bottom of this file; enabling this additionally exposes the site on
# workers.dev, which is fine — this is a public demo.
workers_dev = true

# preview_urls enables *.workers.dev version-preview URLs for PR preview deploys
# (consumed by deploy.yml via `wrangler versions upload --preview-alias pr-<N>`).
# It defaults to MATCH workers_dev rather than to a fixed value, so leaving it
# implicit is how preview URLs silently disappear the day someone sets
# workers_dev = false. Set it explicitly.
preview_urls = true

# ---------------------------------------------------------------------------
# Static asset serving
#
# not_found_handling = "404-page" is the SSG setting: an unmatched GET serves
# dist/404.html. This demo is a single-page site and zfb does not currently emit
# a 404.html, so unmatched paths get a bare 404 today — which is the correct
# behaviour, and the setting starts serving a real page the moment one exists.
# The alternative, "single-page-application", would wrongly return index.html
# with HTTP 200 for every unknown path.
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "404-page"

# ---------------------------------------------------------------------------
# Custom domain routing.
#
# custom_domain = true makes Cloudflare create and manage the DNS record and TLS
# certificate for this hostname automatically (as opposed to matching an
# existing zone route pattern).
#
# Applying this route needs `Zone · Workers Routes · Edit` on the deploying API
# token, on top of the account-level Workers Scripts permission. See
# docs/cloudflare-setup.md.
# ---------------------------------------------------------------------------
[[routes]]
pattern = "zfb-example-corporate-website.takazudomodular.com"
custom_domain = true
